services:
  - type: web
    name: voicebridge-production
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: KEEP_ALIVE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        value: "rzp_test_voicebridge_sandbox"
      - key: RAZORPAY_KEY_SECRET
        value: "secret_voicebridge_sandbox_2026"
      - key: STRIPE_PUBLISHABLE_KEY
        value: "pk_test_voicebridge_sandbox"
      - key: STRIPE_SECRET_KEY
        value: "sk_test_voicebridge_sandbox_2026"
